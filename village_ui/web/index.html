<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the --base-href argument on build.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="The Village - 3D P2P Trust Network">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="The Village">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>The Village - 3D P2P Trust Network</title>
  
  <!-- WebAssembly and WebGL support detection -->
  <script>
    // Check for WebAssembly support
    if (!WebAssembly) {
      document.body.innerHTML = '<div style="text-align: center; padding: 50px;">Your browser does not support WebAssembly. Please use a modern browser.</div>';
    }
    
    // Check for WebGL support
    function checkWebGLSupport() {
      try {
        var canvas = document.createElement('canvas');
        return !!(window.WebGLRenderingContext && 
          (canvas.getContext('webgl') || canvas.getContext('experimental-webgl')));
      } catch(e) {
        return false;
      }
    }
    
    if (!checkWebGLSupport()) {
      document.body.innerHTML = '<div style="text-align: center; padding: 50px;">Your browser does not support WebGL. Please use a modern browser.</div>';
    }
  </script>
  
  <!-- Preload critical assets -->
  <link rel="preload" href="main.dart.js" as="script" crossorigin>
  <link rel="preload" href="assets/fonts/MaterialIcons-Regular.otf" as="font" type="font/otf" crossorigin>
</head>
<body>
  <!-- This script installs service_worker.js to provide PWA functionality.
       It is generated by the Flutter build process. -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('flutter_service_worker.js');
      });
    }
  </script>
  
  <!-- Loading indicator -->
  <div id="loading" style="
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
  ">
    <div style="
      text-align: center;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    ">
      <div style="
        width: 60px;
        height: 60px;
        border: 4px solid rgba(255,255,255,0.3);
        border-top: 4px solid #ffffff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 20px;
      "></div>
      <h2 style="margin: 0; font-weight: 300;">The Village</h2>
      <p style="margin: 10px 0 0 0; opacity: 0.8;">Loading 3D Trust Network...</p>
    </div>
  </div>
  
  <style>
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
  
  <!-- Flutter app container -->
  <script src="main.dart.js" type="application/javascript"></script>
</body>
</html>
