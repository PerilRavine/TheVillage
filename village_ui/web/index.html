<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the --base-href argument on build.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="The Village - 3D P2P Trust Network">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="The Village">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>The Village - 3D P2P Trust Network</title>
  
  <!-- WebAssembly and WebGL support detection -->
  <script>
    // Check for WebAssembly support
    if (!WebAssembly) {
      document.body.innerHTML = '<div style="text-align: center; padding: 50px;">Your browser does not support WebAssembly. Please use a modern browser.</div>';
    }
    
    // Check for WebGL support
    function checkWebGLSupport() {
      try {
        var canvas = document.createElement('canvas');
        return !!(window.WebGLRenderingContext && 
          (canvas.getContext('webgl') || canvas.getContext('experimental-webgl')));
      } catch(e) {
        return false;
      }
    }
    
    if (!checkWebGLSupport()) {
      document.body.innerHTML = '<div style="text-align: center; padding: 50px;">Your browser does not support WebGL. Please use a modern browser.</div>';
    }
  </script>
  
  <!-- Preload critical assets -->
  <link rel="preload" href="main.dart.js" as="script" crossorigin>
  <link rel="preload" href="assets/fonts/MaterialIcons-Regular.otf" as="font" type="font/otf" crossorigin>
</head>
<body>
  <!-- This script installs service_worker.js to provide PWA functionality.
       It is generated by the Flutter build process. -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('flutter_service_worker.js');
      });
    }
  </script>
  
  <!-- Loading indicator -->
  <div id="loading" style="
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
  ">
    <div style="
      text-align: center;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    ">
      <div style="
        width: 60px;
        height: 60px;
        border: 4px solid rgba(255,255,255,0.3);
        border-top: 4px solid #ffffff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 20px;
      "></div>
      <h2 style="margin: 0; font-weight: 300;">The Village</h2>
      <p style="margin: 10px 0 0 0; opacity: 0.8;">Loading 3D Trust Network...</p>
    </div>
  </div>
  
  <style>
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
  
  <!-- 3D Village Map -->
  <div id="loading" style="
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.8);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 24px;
    z-index: 9999;
  ">
    <div style="
      text-align: center;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    ">
      <div style="
        width: 60px;
        height: 60px;
        border: 4px solid rgba(255,255,255,0.3);
        border-top: 4px solid #ffffff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 20px;
      "></div>
      <h2 style="margin: 0; font-weight: 300;">The Village</h2>
      <p style="margin: 10px 0 0 0; opacity: 0.8;">Loading 3D Trust Network...</p>
    </div>
  </div>
  
  <canvas id="village-canvas" style="width: 100%; height: 100%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);"></canvas>
  
  <div style="position: fixed; top: 20px; left: 20px; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 10px; color: white; z-index: 100;">
    <h3 class="text-lg font-bold mb-4">3D Village Map</h3>
    <div class="space-y-2">
      <button id="toggle-3d" class="btn" style="background: #4f46e5; color: white; padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; margin: 5px;">Toggle 3D</button>
      <button id="toggle-separation" class="btn" style="background: #4f46e5; color: white; padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; margin: 5px;">Toggle 3° Separation</button>
      <button id="reset-camera" class="btn" style="background: #4f46e5; color: white; padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; margin: 5px;">Reset Camera</button>
      <div class="mt-4">
        <label class="block text-sm font-medium mb-2">Min Reputation: <span id="reputation-value">0</span></label>
        <input type="range" id="reputation-slider" min="0" max="100" value="0" style="width: 100%;">
      </div>
    </div>
  </div>
  
  <div style="position: fixed; top: 20px; right: 20px; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 10px; color: white; z-index: 100; font-family: monospace;">
    <h4 class="font-bold mb-2">Performance</h4>
    <div>FPS: <span id="fps">0</span></div>
    <div>Nodes: <span id="node-count">0</span></div>
    <div>Visible: <span id="visible-count">0</span></div>
    <div>3° Filter: <span id="separation-status">OFF</span></div>
  </div>
  
  <script type="module">
    // Initialize 3D Village Map
    let sceneGraph;
    let villageMap;
    let renderer;
    let animationId;
    
    // Mock SceneGraph class for demo
    class MockSceneGraph {
      constructor() {
        this._nodes = [];
        this._edges = [];
      }
      
      getAllNodes() {
        return this._nodes;
      }
      
      getAllEdges() {
        return this._edges;
      }
      
      addNode(node) {
        this._nodes.push(node);
      }
      
      getVisibleNodes() {
        return this._nodes;
      }
    }
    
    // Mock VillageNode class for demo
    class MockVillageNode {
      constructor(id, name, position) {
        this.id = id;
        this.name = name;
        this.position = position;
        this.boundingRadius = 50;
      }
      
      updatePosition(newPosition) {
        this.position = newPosition;
      }
      
      getBoundingBox() {
        return {
          min: { x: this.position.x - 0.5, y: this.position.y - 0.5, z: this.position.z - 0.5 },
          max: { x: this.position.x + 0.5, y: this.position.y + 0.5, z: this.position.z + 0.5 }
        };
      }
    }
    
    // Initialize 3D scene
    async function init3D() {
      try {
        // Create scene graph
        sceneGraph = MockSceneGraph();
        
        // Add test villages
        const village1 = new MockVillageNode('village1', 'Tech Village', { x: 100, y: 0, z: 100 });
        const village2 = new MockVillageNode('village2', 'Art Village', { x: -100, y: 0, z: 100 });
        const village3 = new MockVillageNode('village3', 'Science Village', { x: 0, y: 0, z: -150 });
        
        // Add test users
        const user1 = new MockVillageNode('user1', 'Alice', { x: 120, y: 0, z: 80 });
        const user2 = new MockVillageNode('user2', 'Bob', { x: -80, y: 0, z: 120 });
        
        // Add nodes to scene
        sceneGraph.addNode(village1);
        sceneGraph.addNode(village2);
        sceneGraph.addNode(village3);
        sceneGraph.addNode(user1);
        sceneGraph.addNode(user2);
        
        // Create canvas context
        const canvas = document.getElementById('village-canvas');
        const gl = canvas.getContext('webgl2');
        
        if (!gl) {
          throw new Error('WebGL2 not supported');
        }
        
        // Simple WebGL renderer
        renderer = {
          canvas: canvas,
          gl: gl,
          camera: { position: { x: 0, y: 10, z: 20 } },
          getFPS: () => 60,
          dispose: () => {}
        };
        
        // Hide loading screen
        document.getElementById('loading').style.display = 'none';
        
        // Start animation loop
        startAnimation();
        
        console.log('3D Village initialized successfully');
        
      } catch (error) {
        console.error('Failed to initialize 3D:', error);
        document.getElementById('loading').innerHTML = 'Failed to load 3D Village';
      }
    }
    
    // Animation loop
    function startAnimation() {
      let lastTime = 0;
      
      function animate(currentTime) {
        const deltaTime = (currentTime - lastTime) / 1000.0;
        lastTime = currentTime;
        
        // Update stats
        updateStats();
        
        // Continue animation
        animationId = requestAnimationFrame(animate);
      }
      
      animationId = requestAnimationFrame(animate);
    }
    
    // Update statistics display
    function updateStats() {
      if (!renderer) return;
      
      document.getElementById('fps').textContent = renderer.getFPS().toFixed(1);
      document.getElementById('node-count').textContent = sceneGraph.getAllNodes().length;
      document.getElementById('visible-count').textContent = sceneGraph.getVisibleNodes().length;
    }
    
    // Event handlers
    document.getElementById('toggle-3d').addEventListener('click', () => {
      console.log('Toggle 3D clicked');
    });
    
    document.getElementById('toggle-separation').addEventListener('click', () => {
      const isEnabled = document.getElementById('separation-status').textContent === 'OFF';
      document.getElementById('separation-status').textContent = isEnabled ? 'ON' : 'OFF';
    });
    
    document.getElementById('reset-camera').addEventListener('click', () => {
      console.log('Reset camera clicked');
      renderer.camera.position = { x: 0, y: 10, z: 20 };
    });
    
    document.getElementById('reputation-slider').addEventListener('input', (e) => {
      const value = parseFloat(e.target.value);
      document.getElementById('reputation-value').textContent = value;
    });
    
    // Canvas resize handler
    function resizeCanvas() {
      const canvas = document.getElementById('village-canvas');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    
    window.addEventListener('resize', resizeCanvas);
    
    // Initialize on load
    window.addEventListener('load', () => {
      resizeCanvas();
      init3D();
    });
    
    // Cleanup on unload
    window.addEventListener('beforeunload', () => {
      if (animationId) {
        cancelAnimationFrame(animationId);
      }
      renderer?.dispose();
    });
  </script>
</body>
</html>
